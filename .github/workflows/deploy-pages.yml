name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm build
        env:
          VITE_SITE_URL: https://almahayshi.dev

      - name: Generate direct-route entry points
        shell: bash
        run: |
          routes=(
            "work/marsol"
            "work/salon-platform"
            "work/fulfillment-platform"
            "work/wallet-code-platform"
            "work/roast-me-agent"
            "work/hemoly-tools"
            "work/roasting-machine"
            "work/biometric-voting-poc"
            "cv/professional"
            "cv/academic"
          )
          for route in "${routes[@]}"; do
            mkdir -p "dist/${route}"
            cp dist/index.html "dist/${route}/index.html"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
